name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build JobSort.slnx -c Release
      - name: Test
        run: dotnet test JobSort.slnx -c Release --no-build --verbosity normal
